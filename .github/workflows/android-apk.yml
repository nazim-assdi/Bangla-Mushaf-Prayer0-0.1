name: Build Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript validation (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate branded Android launcher icons
        run: node scripts/create-android-icons.cjs

      - name: Add runtime permissions for Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK",
              "android.permission.SCHEDULE_EXACT_ALARM",
          ]
          opening_tag_end = source.find(">", source.find("<manifest"))
          if opening_tag_end < 0:
              raise SystemExit("Android manifest opening tag was not found")
          missing = [
              f'    <uses-permission android:name="{name}" />'
              for name in permissions
              if f'android:name="{name}"' not in source
          ]
          if missing:
              source = source[:opening_tag_end + 1] + "\n" + "\n".join(missing) + source[opening_tag_end + 1:]
              manifest.write_text(source)
          PY

      - name: Copy web build into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bangla-mushaf-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
