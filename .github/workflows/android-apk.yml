name: Build Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure native Google sign-in for Android
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          variables = Path("android/variables.gradle")
          if variables.exists():
              text = variables.read_text()
              marker = "ext {"
              if marker in text:
                  additions = []
                  if "rgcfaIncludeGoogle" not in text:
                      additions.append("    rgcfaIncludeGoogle = true")
                  if "androidxCredentialsVersion" not in text:
                      additions.append("    androidxCredentialsVersion = '1.3.0'")
                  if additions:
                      text = text.replace(marker, marker + "\n" + "\n".join(additions), 1)
                      variables.write_text(text)

          raw = os.environ.get("FIREBASE_ANDROID_GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              print("::warning::FIREBASE_ANDROID_GOOGLE_SERVICES_JSON is not configured. APK will build, but native Google sign-in cannot work until the Android Firebase config is added.")
              raise SystemExit(0)

          config = json.loads(raw)
          package = config.get("client", [{}])[0].get("client_info", {}).get("android_client_info", {}).get("package_name")
          if package != "com.nazimassdi.banglamushaf":
              raise SystemExit("google-services.json package_name must be com.nazimassdi.banglamushaf")
          Path("android/app/google-services.json").write_text(json.dumps(config, indent=2) + "\n")

          root_gradle = Path("android/build.gradle")
          root_text = root_gradle.read_text()
          if "com.google.gms:google-services" not in root_text:
              if "dependencies {" not in root_text:
                  raise SystemExit("Could not find dependencies block in android/build.gradle")
              root_text = root_text.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
              root_gradle.write_text(root_text)

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text += "\napply plugin: 'com.google.gms.google-services'\n"
              app_gradle.write_text(app_text)
          print("Android Firebase configuration installed.")
          PY

      - name: Add exact alarm permission for Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if "android.permission.SCHEDULE_EXACT_ALARM" not in source:
              opening_tag_end = source.find(">", source.find("<manifest"))
              if opening_tag_end < 0:
                  raise SystemExit("Android manifest opening tag was not found")
              source = source[:opening_tag_end + 1] + "\n" + permission + source[opening_tag_end + 1:]
              manifest.write_text(source)
          PY

      - name: Copy web build into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bangla-mushaf-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
