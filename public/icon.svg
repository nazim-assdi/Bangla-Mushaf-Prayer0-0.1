<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Outer subtle Islamic geometric ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Quran Rehal (Stand) & Open Book -->
  <g transform="translate(256, 275)" filter="url(#glow)">
    <!-- Book Stand (Rehal) Base -->
    <path d="M -90,70 L 0,10 L 90,70 L 65,85 L 0,40 L -65,85 Z" fill="#b45309" />
    <path d="M -110,95 L 0,18 L 110,95 L 85,110 L 0,48 L -85,110 Z" fill="#78350f" opacity="0.8" />

    <!-- Left Page -->
    <path d="M -12,-30 C -60,-40 -130,-25 -155,10 C -155,50 -140,85 -130,100 C -105,75 -50,60 -8,70 Z" fill="#faf7ee" />
    <!-- Left Page Trim & Lines -->
    <path d="M -15,-20 C -55,-30 -115,-18 -138,12 C -120,65 -85,55 -15,60" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M -30,-5 C -60,-12 -100,-5 -120,15" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
    <path d="M -30,15 C -60,8 -100,15 -120,35" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
    <path d="M -30,35 C -60,28 -95,35 -115,55" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Right Page -->
    <path d="M 12,-30 C 60,-40 130,-25 155,10 C 155,50 140,85 130,100 C 105,75 50,60 8,70 Z" fill="#faf7ee" />
    <!-- Right Page Trim & Lines -->
    <path d="M 15,-20 C 55,-30 115,-18 138,12 C 120,65 85,55 15,60" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M 30,-5 C 60,-12 100,-5 120,15" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
    <path d="M 30,15 C 60,8 100,15 120,35" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
    <path d="M 30,35 C 60,28 95,35 115,55" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Spine -->
    <path d="M -12,-30 C 0,-36 0,65 -8,70 L 8,70 C 0,65 0,-36 12,-30 Z" fill="#d97706" />
  </g>

  <!-- Golden Crescent & Eight-Pointed Star Above Book -->
  <g transform="translate(256, 140)" fill="url(#gold)">
    <!-- Crescent Moon -->
    <path d="M 0,-50 A 45,45 0 1 0 45,-5 A 35,35 0 1 1 -5,-45 A 45,45 0 0 0 0,-50 Z" transform="rotate(-30)" />
    <!-- Rub el Hizb / 8-pointed star in center -->
    <g transform="translate(15, -15)">
      <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" />
      <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" transform="rotate(45)" opacity="0.8" />
    </g>
  </g>

  <!-- Islamic Calligraphy Motif Accent / Bengali Label -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="24" fill="#fef08a" text-anchor="middle" letter-spacing="2">
    AL-QURAN AL-KAREEM
  </text>
</svg>
